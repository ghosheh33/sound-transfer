<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نقل بالصوت</title>
  <meta name="description" content="نقل النصوص والصور والملفات بين هاتفين عبر الصوت فقط، بدون إنترنت أو بلوتوث.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4" /></svg>
      <h1 data-i18n="appName">نقل بالصوت</h1>
      <button class="lang" id="langBtn" aria-label="Language">EN</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="send" aria-selected="true" data-i18n="tabSend">إرسال</button>
      <button role="tab" data-tab="receive" aria-selected="false" data-i18n="tabReceive">استقبال</button>
      <button role="tab" data-tab="help" aria-selected="false" data-i18n="tabHelp">طريقة الاستخدام</button>
    </nav>
  </header>

  <main>
    <!-- SEND -->
    <section id="tab-send" class="panel" role="tabpanel">
      <div class="card">
        <h2 data-i18n="whatToSend"></h2>
        <div class="seg" id="kind">
          <button data-kind="text" class="on" data-i18n="kindText"></button>
          <button data-kind="image" data-i18n="kindImage"></button>
          <button data-kind="file" data-i18n="kindFile"></button>
        </div>

        <div data-for="text">
          <textarea id="text" rows="5" data-i18n-ph="textPh" dir="auto"></textarea>
        </div>

        <div data-for="image" hidden>
          <label class="file-pick">
            <input type="file" id="imageInput" accept="image/*" multiple>
            <span data-i18n="pickImages"></span>
          </label>
          <div class="grid2" id="imgOpts" hidden>
            <label><span data-i18n="maxDim"></span>
              <select id="imgDim"></select>
            </label>
            <label><span data-i18n="format"></span>
              <select id="imgFormat">
                <option value="webp" data-i18n="webp"></option>
                <option value="jpeg" data-i18n="jpeg"></option>
              </select>
            </label>
            <label class="full"><span><span data-i18n="quality"></span> <output id="imgQOut">0.4</output></span>
              <input type="range" id="imgQ" min="0.1" max="0.9" step="0.05" value="0.4">
            </label>
            <label class="check full"><input type="checkbox" id="imgGray"> <span data-i18n="gray"></span></label>
          </div>
        </div>

        <div data-for="file" hidden>
          <label class="file-pick">
            <input type="file" id="fileInput" multiple>
            <span data-i18n="pickFiles"></span>
          </label>
          <p class="muted small" data-i18n="filesHint"></p>
        </div>

        <ul class="queue" id="queue"></ul>
      </div>

      <div class="card">
        <h2 data-i18n="settings"></h2>
        <p class="label" data-i18n="speed"></p>
        <div class="modes" id="modes"></div>
        <label class="check switch">
          <input type="checkbox" id="arq" checked>
          <span><b data-i18n="confirm"></b><br><span class="muted small" data-i18n="confirmHint"></span></span>
        </label>
        <div class="grid2" id="oneWayOpts" hidden>
          <label><span data-i18n="protection"></span>
            <select id="redundancy">
              <option value="0" data-i18n="none"></option>
              <option value="10">10%</option>
              <option value="20" selected></option>
              <option value="35">35%</option>
              <option value="50">50%</option>
            </select>
          </label>
          <label><span data-i18n="passes"></span>
            <select id="passes">
              <option value="1" selected data-i18n="once"></option>
              <option value="2" data-i18n="twice"></option>
              <option value="Infinity" data-i18n="untilStop"></option>
            </select>
          </label>
        </div>
        <label class="vol"><span><span data-i18n="volume"></span> <output id="volOut">90%</output></span>
          <input type="range" id="vol" min="0.1" max="1" step="0.05" value="0.9">
        </label>
      </div>

      <div class="card sticky">
        <div class="summary" id="summary"></div>
        <div class="bar"><div id="sendBar"></div></div>
        <p class="status" id="sendStatus" data-i18n="ready"></p>
        <button class="primary" id="sendBtn" data-i18n="send"></button>
      </div>
    </section>

    <!-- RECEIVE -->
    <section id="tab-receive" class="panel" role="tabpanel" hidden>
      <div class="card">
        <div class="listen-row">
          <button class="primary" id="listenBtn" data-i18n="listen"></button>
          <div class="meter"><div id="meter"></div></div>
        </div>
        <p class="status" id="rxStatus" data-i18n="rxIdle"></p>
        <p class="muted small" id="rxStats"></p>
      </div>

      <div class="card" id="current" hidden>
        <h2 id="curTitle"></h2>
        <p class="muted" id="curInfo"></p>
        <div class="bar"><div id="rxBar"></div></div>
        <div class="packets" id="packets"></div>
        <div id="curBody"></div>
      </div>

      <div class="list-head">
        <h2 data-i18n="received"></h2>
        <button class="link" id="clearAll" data-i18n="clearAll"></button>
      </div>
      <div id="received"><p class="muted" data-i18n="empty"></p></div>
    </section>

    <!-- HELP -->
    <section id="tab-help" class="panel" role="tabpanel" hidden>
      <div class="card prose">
        <div data-i18n-html="helpHtml"></div>
        <table>
          <thead><tr><th data-i18n="thMode"></th><th data-i18n="thSpeed"></th><th data-i18n="thTime"></th></tr></thead>
          <tbody id="modeTable"></tbody>
        </table>
        <div data-i18n-html="howHtml"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
